services:
  - type: web
    name: chapter-one-bookstore
    runtime: java
    buildCommand: "./mvnw package -DskipTests"
    startCommand: "java -jar target/online-bookstore-1.0.0.jar"
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: JAVA_VERSION
        value: "21"
    plan: free
